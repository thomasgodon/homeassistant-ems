[build-system]
requires = ["setuptools>=43"]
build-backend = "setuptools.build_meta"

[project]
name = "hass-ems"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "homeassistant>=2024.11.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "freezegun>=1.4",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=custom_components.ems --cov-branch"
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 80
omit = [
    "custom_components/ems/__init__.py",
    "custom_components/ems/binary_sensor.py",
    "custom_components/ems/config_flow.py",
    "custom_components/ems/coordinator.py",
    "custom_components/ems/number.py",
    "custom_components/ems/select.py",
    "custom_components/ems/sensor.py",
]

[tool.coverage.run]
source = ["custom_components/ems"]
omit = [
    "custom_components/ems/__init__.py",
    "custom_components/ems/binary_sensor.py",
    "custom_components/ems/config_flow.py",
    "custom_components/ems/coordinator.py",
    "custom_components/ems/number.py",
    "custom_components/ems/select.py",
    "custom_components/ems/sensor.py",
]
