name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check custom_components/ems tests

      - name: Test (80% gate)
        run: pytest tests/ --cov=custom_components.ems --cov-branch --cov-fail-under=80

      - name: Test pure modules (100% gate)
        run: >
          pytest
          --cov=custom_components.ems.strategy
          --cov=custom_components.ems.ev_scheduler
          --cov-branch --cov-fail-under=100
          tests/test_strategy.py tests/test_ev_scheduler.py
